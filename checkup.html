<!doctype html>
<!-- 公開点検のページ(画面設計書 SC-02)。自分の公開リポジトリを升目の表で並べ、× と ? の理由を開き、結果をコピーする。 -->
<!-- 文字の差し込みと状態の切り替えは checkup.js。ここは骨組みとアイコンの型だけ。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公開点検</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="checkup.css">
<script type="module" src="checkup.js"></script>
</head>
<body>
<div class="pg">
	<header class="app-top">
		<svg class="logo" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/><circle cx="10.5" cy="10.5" r="5.6" fill="none" stroke="var(--accent-ink)" stroke-width="1.9"/><path d="M7.9 9.3h5.2M7.9 11.9h3.4" stroke="var(--accent-ink)" stroke-width="1.5" stroke-linecap="round"/><path d="M14.8 14.8 18.6 18.6" stroke="var(--accent-ink)" stroke-width="2.3" stroke-linecap="round"/></svg>
		<span class="app-name">RepoLens</span>
		<span class="app-sep" aria-hidden="true"></span>
		<h1 class="app-title">公開点検</h1>
	</header>

	<div id="noLogin" class="empty" hidden>
		<svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg>
		<p class="empty-t">設定でユーザー名を入れると公開点検が使える</p>
		<button type="button" id="openOptions" class="btn btn-tonal"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg><span>設定を開く</span></button>
	</div>

	<div id="main" hidden>
		<div class="ck-sum">
			<dl class="ck-meta">
				<div><dt>ユーザー</dt><dd id="login" class="mono"></dd></div>
				<div><dt id="whenLabel">前回の点検</dt><dd id="when" class="num"></dd></div>
			</dl>
			<div class="ck-actions">
				<button type="button" id="run" class="btn btn-primary"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg><span>点検し直す</span></button>
				<button type="button" id="copy" class="btn btn-tonal"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M3 10.5V3.2c0-.4.3-.7.7-.7h6.8"/></svg><span>結果をコピー</span></button>
				<p id="copyMsg" class="copy-msg" role="status"></p>
				<span id="rate" class="rate"></span>
			</div>
		</div>
		<div id="prog" class="prog" role="progressbar" aria-valuemin="0" hidden><span></span></div>
		<div id="notes"></div>
		<div id="body" class="ck-body"></div>
		<footer class="ck-legend">
			<ul class="legend">
				<li><span class="mk mk-pass" role="img" aria-label="満たす">○</span>満たす</li>
				<li><span class="mk mk-fail" role="img" aria-label="満たさない">×</span>満たさない</li>
				<li><span class="mk mk-unk" role="img" aria-label="取れなかった">?</span>取れなかった</li>
				<li><span class="mk mk-na" role="img" aria-label="該当しない">−</span>該当しない</li>
			</ul>
			<p>※は GitHub公開ルールに無い項目</p>
			<p>C-9・C-10(README の中身)は popup だけで点検する</p>
		</footer>
	</div>
</div>

<template id="icons">
	<svg data-ic="clock" class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>
	<svg data-ic="info" class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v4"/><circle cx="8" cy="4.9" r=".55" fill="currentColor"/></svg>
	<svg data-ic="alert" class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.8"/><circle cx="8" cy="11.1" r=".55" fill="currentColor"/></svg>
	<svg data-ic="check" class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"/></svg>
	<svg data-ic="table" class="ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M2 6h12M2 10h12M6 6v8"/></svg>
</template>
</body>
</html>
