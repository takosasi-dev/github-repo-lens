# Release に添えた Web 版（RailRampage_web.zip）を GitHub Pages に置き、ブラウザですぐ遊べるようにする。
# ビルドはしない（Godot の書き出しは手元で行い、その zip を Release に添える）。Release を出すたびに最新の版に入れ替わる
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # gh release download
      pages: write # actions/deploy-pages
      id-token: write # actions/deploy-pages (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 最新の Release から Web 版を取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern RailRampage_web.zip
          unzip -q RailRampage_web.zip -d site
          test -f site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
