name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 は下限、3.14 は Arch が配っている版
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: 偽のファイルシステムでのテスト
        run: python tests/run_all.py

      # 本物のシステムで一覧を出せるか(消さない)。Ubuntu なので pacman 系は「無し」になる
      - name: 実物で --report / --json / clean の dry-run
        run: |
          python -m disksift --report
          python -m disksift --json > /dev/null
          python -m disksift clean user-cache
